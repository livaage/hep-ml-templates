name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  lint:
    name: Lint & type-check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
      - run: pip install --upgrade pip
      - run: pip install -e ".[dev]"
      - name: ruff
        run: ruff check src tests
      - name: black --check
        run: black --check src tests
      - name: isort --check
        run: isort --check-only src tests
      - name: mypy
        run: mypy src/mlpipe
        continue-on-error: true  # currently permissive; tighten and remove once types are filled in

  test:
    name: Test (py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"
      - run: pip install --upgrade pip
      - run: pip install -e ".[dev,all]"
      - name: pytest
        run: pytest tests/ -v --cov=src/mlpipe --cov-report=xml --cov-report=term-missing
      - name: Upload coverage artifact
        if: matrix.python-version == '3.12'
        uses: actions/upload-artifact@v4
        with:
          name: coverage-xml
          path: coverage.xml
