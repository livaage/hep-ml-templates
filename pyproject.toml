[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "hep-ml-templates"
version = "0.1.0"
description = "Block-based HEP ML pipeline templates: install whole pipelines or individual components."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [{ name = "Arvind Tawker" }]
maintainers = [{ name = "livaage" }]
# These are always installed. Extras below add *additional* deps on top —
# they should not re-list these.
dependencies = [
  "numpy>=1.22",
  "pandas>=2.0",
  "scikit-learn>=1.2",
  "omegaconf>=2.3",
]

[project.optional-dependencies]
# `core` is kept as a no-op extra so `pip install -e ".[core]"` works as
# documented in the README. The base `dependencies` above are already enough.
core = []

# Per-block extras: only the packages that aren't in the base dependencies.
data-csv = []
data-higgs = ["requests>=2.25"]
data-uproot = ["uproot>=5.0", "awkward>=2.0"]
model-xgb = ["xgboost>=1.7"]
model-decision-tree = []
model-random-forest = []
model-svm = []
model-mlp = []
model-adaboost = []
model-ensemble = ["xgboost>=1.7"]
model-torch = ["torch>=2.2"]
model-lightning = ["torch>=2.2", "lightning>=2.2"]
model-gnn = ["torch>=2.2", "torch-geometric>=2.5"]
preprocessing = []
evaluation = []

# Algorithm shortcuts (model + preprocessing combo, matches the install-local extras).
xgb = ["xgboost>=1.7"]
decision-tree = []
random-forest = []
svm = []
mlp = []
adaboost = []
ensemble = ["xgboost>=1.7"]
torch = ["torch>=2.2", "lightning>=2.2"]
gnn = ["torch>=2.2", "torch-geometric>=2.5"]
autoencoder = ["torch>=2.2", "lightning>=2.2"]
transformer = ["torch>=2.2", "lightning>=2.2"]
cnn = ["torch>=2.2", "lightning>=2.2"]

# Complete pipeline bundles — list only what extras add beyond base deps.
pipeline-xgb = ["xgboost>=1.7"]
pipeline-decision-tree = []
pipeline-ensemble = ["xgboost>=1.7"]
pipeline-autoencoder-lightning = ["torch>=2.2", "lightning>=2.2", "matplotlib>=3.5"]
pipeline-neural = []
pipeline-gnn = ["torch>=2.2", "torch-geometric>=2.5"]
all = [
  "xgboost>=1.7",
  "torch>=2.2",
  "lightning>=2.2",
  "torch-geometric>=2.5",
  "uproot>=5.0",
  "awkward>=2.0",
  "requests>=2.25",
  "matplotlib>=3.5",
]

# Development
dev = [
  "pytest>=7.3",
  "pytest-cov>=4.1",
  "ruff>=0.5",
  "black>=24.1",
  "pre-commit>=3.6",
  "mypy>=1.8",
  "isort>=5.13",
  "bandit>=1.7",
]

[project.scripts]
mlpipe = "mlpipe.cli.main:main"
mlpipe-manager = "mlpipe.cli.manager:main"

[tool.black]
line-length = 100
target-version = ['py310']
include = '\.pyi?$'
extend-exclude = '''
/(
  # directories
  \.eggs
  | \.git
  | \.hg
  | \.mypy_cache
  | \.tox
  | \.venv
  | build
  | dist
)/
'''

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "UP",  # pyupgrade
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "S",   # flake8-bandit
    "T20", # flake8-print
]
ignore = [
    "S101", # Use of assert (we use it in tests and as sanity checks)
    "B008", # function calls in defaults — common in ML configs
]

# ML codebases use X / y / X_train naming everywhere, so pep8-naming (N) is not enabled.
# Docstring enforcement (D) is also off — docstrings exist where they're useful.

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["T201", "S"]                     # tests print progress; asserts and dynamic imports are fine
"src/mlpipe/__init__.py" = ["F401"]           # re-exports
# Block __init__.py files import submodules for their @register side effects.
"src/mlpipe/blocks/**/__init__.py" = ["F401", "S110"]
"src/mlpipe/blocks/__init__.py" = ["F401"]
"src/mlpipe/cli/*" = ["T201"]                 # CLI prints to stdout
"src/mlpipe/core/universal_runner.py" = ["T201"]  # prints user-facing pipeline progress
# uproot_loader probes for optional deps with a try/import block
"src/mlpipe/blocks/ingest/uproot_loader.py" = ["F401"]

[tool.isort]
profile = "black"
line_length = 100
multi_line_output = 3
include_trailing_comma = true
force_grid_wrap = 0
use_parentheses = true
ensure_newline_before_comments = true

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false  # Start permissive, can be stricter later
ignore_missing_imports = true
no_implicit_optional = true
show_error_codes = true

[tool.bandit]
exclude_dirs = ["tests", "build", "dist"]
skips = ["B101"]  # Skip assert_used test

[tool.pydocstyle]
convention = "google"
ignore = "D100,D104,D203,D213"

[tool.pytest.ini_options]
minversion = "7.0"
addopts = [
    "--strict-markers",
    "--strict-config",
    "--cov=src/mlpipe",
    "--cov-report=term-missing",
    "--cov-report=html",
    "--cov-report=xml",
]
testpaths = ["tests"]
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
    "integration: marks tests as integration tests",
    "unit: marks tests as unit tests",
]

[tool.hatch.build.targets.wheel]
packages = ["src/mlpipe"]
